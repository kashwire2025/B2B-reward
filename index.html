<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2B Reward</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- TON Connect UI for Wallet Connection -->
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-blue { background-color: #2563eb; }
    .btn-green { background-color: #16a34a; }
    .btn-purple { background-color: #9333ea; }
    .btn-red { background-color: #dc2626; }
  </style>
</head>
<body>

  <h1>B2B Reward</h1>
  
  <div class="card">
    <h3>Balance: <span id="balance">0</span> B2B</h3>
    <p style="font-size: 12px; color: #94a3b8;">Minimum payout: 20,000 B2B ($10)</p>
  </div>

  <!-- TON Wallet Connect Button -->
  <div id="ton-connect" style="display: flex; justify-content: center; margin-bottom: 20px;"></div>

  <!-- Task Buttons -->
  <div class="card">
    <button class="btn btn-blue" onclick="handleTask('daily_checkin')">Daily Check-in (+100 B2B)</button>
    <button class="btn btn-green" onclick="handleTask('unlimited_ad')">Watch Unlimited Ad (+100 B2B)</button>
    <button class="btn btn-blue" onclick="handleTask('daily_ad')">Daily Ad (<span id="ad-count">0</span>/40) (+100 B2B)</button>
    <button class="btn btn-purple" onclick="handleTask('social_task')">Social Special Task (+200 B2B)</button>
  </div>

  <div class="card">
    <button class="btn btn-red" onclick="handleWithdrawal()">Request Withdrawal</button>
  </div>

  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Initialize TON Wallet Connection
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: 'https://b2b-reward.vercel.app/tonconnect-manifest.json', // Updated after deployment
      buttonRootId: 'ton-connect'
    });

    function handleTask(taskType) {
      // Ad execution script will be added in Step 3 after creating your Monetag Zone ID
      alert("Triggering task: " + taskType);
    }

    function handleWithdrawal() {
      const wallet = tonConnectUI.account?.address;
      if (!wallet) {
        alert("Please connect your TON wallet first!");
        return;
      }
      alert("Withdrawal requested for wallet: " + wallet);
    }
  </script>
</body>
</html>
