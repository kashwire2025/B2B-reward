    function toggleTheme() {
      const isLight = document.body.getAttribute('data-theme') === 'light';
      if (isLight) {
        document.body.removeAttribute('data-theme');
        document.getElementById('theme-icon').innerText = '🌙';
        localStorage.setItem('app_theme', 'dark');
      } else {
        document.body.setAttribute('data-theme', 'light');
        document.getElementById('theme-icon').innerText = '☀️';
        localStorage.setItem('app_theme', 'light');
      }
    }

    const savedTheme = localStorage.getItem('app_theme');
    if (savedTheme === 'light') {
      document.body.setAttribute('data-theme', 'light');
      document.getElementById('theme-icon').innerText = '☀️';
    }

    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({

    async function initUser() {
      applyLanguage(currentLang);
      try {
        let { data, error } = await supabaseClient

          .select('*')
          .eq('telegram_id', telegramId)
          .single();

          const { data: newUser, error: createError } = await supabaseClient

            .insert([{ telegram_id: telegramId, balance: 0 }])
            .select()
            .single();

          if (createError) throw createError;
          data = newUser;
        }

        userBalance = data ? data.balance : 0;
        updateUI();
      } catch (err) {
        console.error('Error initializing user:', err);
      }
    }

    function updateUI() {
      document.getElementById('balance').innerText = userBalance.toLocaleString();
      document.getElementById('usdt-val').innerText = (userBalance / 10000).toFixed(4);

    async function updateBalance(amountToAdd) {
      userBalance += amountToAdd;
      updateUI();

      await supabaseClient
        .from('users')
        .update({ balance: userBalance })
        .eq('telegram_id', telegramId);
    }

    function startCountdown(buttonId, defaultText, callback) {
      const btn = document.getElementById(buttonId);
      btn.disabled = true;
      let seconds = 5;
      
      const timer = setInterval(() => {
        btn.innerText = `${seconds}s`;
        seconds--;
        if (seconds < 0) {
          clearInterval(timer);
          btn.disabled = false;
          btn.innerText = defaultText;
          if (callback) callback();
        }
      }, 1000);
    }

    }

    function handleTaskFlow(btnId, targetUrl, reward) {
      const btn = document.getElementById(btnId);
      const currentState = taskStates[btnId] || 'start';
      const t = translations[currentLang] || translations.en;

      if (currentState === 'start') {
        window.open(targetUrl, '_blank');
        taskStates[btnId] = 'claim';
        btn.innerText = t.claim;
        btn.style.background = '#8957e5';
      } else if (currentState === 'claim') {
        updateBalance(reward);
        taskStates[btnId] = 'done';
        btn.innerText = '✓';
        btn.classList.add('done');
        btn.disabled = true;
      }
    }
