<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Monetag Verification Tag -->
  <meta name="monetag" content="80352d1141f5c6b9d15bfb4a5c0dc647">

  <title>B2B Reward</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- TON Connect UI -->
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-blue { background-color: #2563eb; }
    .btn-green { background-color: #16a34a; }
    .btn-purple { background-color: #9333ea; }
    .btn-red { background-color: #dc2626; }
  </style>
</head>
<body>

  <h1>B2B Reward</h1>
  
  <div class="card">
    <h3>Balance: <span id="balance">0</span> B2B</h3>
    <p style="font-size: 12px; color: #94a3b8;">Minimum payout: 20,000 B2B ($10)</p>
  </div>

  <div id="ton-connect" style="display: flex; justify-content: center; margin-bottom: 20px;"></div>

  <div class="card">
    <button class="btn btn-blue" onclick="handleTask('daily_checkin')">Daily Check-in (+100 B2B)</button>
    <button class="btn btn-green" onclick="watchRewardedAd()">Watch Ad (+100 B2B)</button>
    <button class="btn btn-purple" onclick="handleTask('social_task')">Social Special Task (+200 B2B)</button>
  </div>

  <div class="card">
    <button class="btn btn-red" onclick="handleWithdrawal()">Request Withdrawal</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let balance = 0;

    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: 'https://b2-b-reward.vercel.app/tonconnect-manifest.json',
      buttonRootId: 'ton-connect'
    });

    function watchRewardedAd() {
      alert("Ad completed! You earned 100 B2B.");
      balance += 100;
      document.getElementById('balance').innerText = balance;
    }

    function handleTask(type) {
      balance += 100;
      document.getElementById('balance').innerText = balance;
      alert("Task completed! +100 B2B");
    }

    function handleWithdrawal() {
      const wallet = tonConnectUI.account?.address;
      if (!wallet) {
        alert("Please connect your TON wallet first!");
        return;
      }
      if (balance < 20000) {
        alert("Minimum balance for withdrawal is 20,000 B2B");
        return;
      }
      alert("Withdrawal requested for address: " + wallet);
    }
  </script>
</body>
</html>
