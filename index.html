<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Monetag Verification Tag -->
  <meta name="monetag" content="80352d1141f5c6b9d15bfb4a5c0dc647">

  <title>B2B Reward</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- TON Connect UI -->
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

  <!-- Monetag Ad Tag -->
  <script src="https://quge5.com/88/tag.min.js" data-zone="274553" async data-cfasync="false"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-blue { background-color: #2563eb; }
    .btn-green { background-color: #16a34a; }
    .btn-purple { background-color: #9333ea; }
    .btn-red { background-color: #dc2626; }
  </style>
</head>
<body>

  <h1>B2B Reward</h1>
  
  <div class="card">
    <h3>Balance: <span id="balance">Loading...</span> B2B</h3>
    <p style="font-size: 12px; color: #94a3b8;">Minimum payout: 20,000 B2B ($10)</p>
  </div>

  <div id="ton-connect" style="display: flex; justify-content: center; margin-bottom: 20px;"></div>

  <div class="card">
    <button class="btn btn-blue" onclick="handleTask('daily_checkin')">Daily Check-in (+100 B2B)</button>
    <button class="btn btn-green" onclick="watchRewardedAd()">Watch Ad (+100 B2B)</button>
    <button class="btn btn-purple" onclick="handleTask('social_task')">Social Special Task (+200 B2B)</button>
  </div>

  <div class="card">
    <button class="btn btn-red" onclick="handleWithdrawal()">Request Withdrawal</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://drfbjrbleuyjunxzjsae.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyZmJqcmJmZXV5anVueHpqc2FlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNDQzODUsImV4cCI6MjEwMzYyMDM4NX0.XMn6B-o6_Qbtwp1aYQIl0vOLKvNTN2irPO47hEtoVSE';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const tg = window.Telegram.WebApp;
    tg.expand();

    const user = tg.initDataUnsafe?.user;
    const telegramId = user?.id ? String(user.id) : 'test_user_123';
    let userBalance = 0;

    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: 'https://b2-b-reward.vercel.app/tonconnect-manifest.json',
      buttonRootId: 'ton-connect'
    });

    // Initialize user in Supabase
    async function initUser() {
      try {
        let { data, error } = await supabaseClient
          .from('users')
          .select('*')
          .eq('telegram_id', telegramId)
          .single();

        if (error && error.code === 'PGRST116') {
          const { data: newUser, error: createError } = await supabaseClient
            .from('users')
            .insert([{ telegram_id: telegramId, balance: 0 }])
            .select()
            .single();

          if (createError) throw createError;
          data = newUser;
        }

        userBalance = data ? data.balance : 0;
        document.getElementById('balance').innerText = userBalance;
      } catch (err) {
        console.error('Error initializing user:', err);
        document.getElementById('balance').innerText = '0';
      }
    }

    // Sync balance changes to Supabase
    async function updateBalance(amountToAdd) {
      userBalance += amountToAdd;
      document.getElementById('balance').innerText = userBalance;

      await supabaseClient
        .from('users')
        .update({ balance: userBalance })
        .eq('telegram_id', telegramId);
    }

    // Save TON Wallet address on connection
    tonConnectUI.onStatusChange(async (wallet) => {
      if (wallet) {
        const address = wallet.account.address;
        await supabaseClient
          .from('users')
          .update({ wallet_address: address })
          .eq('telegram_id', telegramId);
      }
    });

    function watchRewardedAd() {
      if (typeof show_274553 !== 'undefined') {
        show_274553().then(() => {
          updateBalance(100);
          alert("Ad completed! You earned 100 B2B.");
        }).catch(() => {
          updateBalance(100);
          alert("Task completed! +100 B2B");
        });
      } else {
        updateBalance(100);
        alert("Ad Task Completed! +100 B2B");
      }
    }

    function handleTask(type) {
      const reward = type === 'social_task' ? 200 : 100;
      updateBalance(reward);
      alert(`Task completed! +${reward} B2B`);
    }

    function handleWithdrawal() {
      const wallet = tonConnectUI.account?.address;
      if (!wallet) {
        alert("Please connect your TON wallet first!");
        return;
      }
      if (userBalance < 20000) {
        alert("Minimum balance for withdrawal is 20,000 B2B");
        return;
      }
      alert("Withdrawal requested for address: " + wallet);
    }

    // Initialize application state on load
    initUser();
  </script>
</body>
</html>
